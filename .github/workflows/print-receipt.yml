name: Print profile receipt

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Render receipt
        run: bun scripts/render-receipt.ts
        env:
          GH_USER: ${{ github.repository_owner }}
          # PROFILE_TOKEN (fine-grained PAT, Metadata: read) を登録するとプライベートリポジトリも集計に含まれる
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "レシート: 本日分を印字"
          git pull --rebase
          git push
